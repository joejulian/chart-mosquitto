name: Bump Mosquitto version (Chart.yaml) + open/update PR

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: chart
      UPSTREAM_REPO: https://github.com/eclipse-mosquitto/mosquitto.git
      PR_BRANCH_PREFIX: bump-mosquitto
      PR_LABEL: dependencies

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install python deps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install ruamel.yaml

      - name: Discover latest upstream tag (git tags, not releases)
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          # Sort tags by semver-ish refname ordering, pick the last vX.Y.Z style tag
          latest_tag="$(
            git ls-remote --tags --sort='v:refname' "${UPSTREAM_REPO}" \
              | awk '{print $2}' \
              | sed -n 's#^refs/tags/##p' \
              | sed 's/\^{}$//' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | tail -n 1
          )"

          if [[ -z "${latest_tag}" ]]; then
            echo "Failed to determine latest upstream tag" >&2
            exit 1
          fi

          latest_ver="${latest_tag#v}"

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "latest_ver=${latest_ver}" >> "$GITHUB_OUTPUT"

      - name: Read current chart versions
        id: current
        shell: bash
        run: |
          set -euo pipefail

          chart_file="${CHART_DIR}/Chart.yaml"

          cur_app="$(
            awk -F': ' '$1=="appVersion"{print $2; exit}' "${chart_file}" \
              | tr -d '"' | tr -d "'"
          )"
          cur_chart="$(
            awk -F': ' '$1=="version"{print $2; exit}' "${chart_file}" \
              | tr -d '"' | tr -d "'"
          )"

          echo "cur_app=${cur_app}" >> "$GITHUB_OUTPUT"
          echo "cur_chart=${cur_chart}" >> "$GITHUB_OUTPUT"

      - name: Decide whether bump is needed
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          latest="${{ steps.upstream.outputs.latest_ver }}"
          cur="${{ steps.current.outputs.cur_app }}"

          if [[ "${latest}" == "${cur}" ]]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Chart.yaml (appVersion + version)
        if: steps.decide.outputs.bump == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chart_file="${CHART_DIR}/Chart.yaml"
          latest="${{ steps.upstream.outputs.latest_ver }}"

          python3 - <<'PY'
          from ruamel.yaml import YAML
          from ruamel.yaml.scalarstring import DoubleQuotedScalarString
          from pathlib import Path
          import os

          chart_file = Path(os.environ["CHART_FILE"])
          latest = os.environ["LATEST_VER"]

          yaml = YAML()
          yaml.preserve_quotes = True

          data = yaml.load(chart_file.read_text())

          # Keep it simple: chart version == upstream version
          data["appVersion"] = DoubleQuotedScalarString(latest)
          data["version"] = DoubleQuotedScalarString(latest)

          with chart_file.open("w") as f:
            yaml.dump(data, f)
          PY
        env:
          CHART_FILE: ${{ env.CHART_DIR }}/Chart.yaml
          LATEST_VER: ${{ steps.upstream.outputs.latest_ver }}

      - name: Create or update PR branch + commit
        if: steps.decide.outputs.bump == 'true'
        shell: bash
        run: |
          set -euo pipefail

          latest="${{ steps.upstream.outputs.latest_ver }}"
          branch="${PR_BRANCH_PREFIX}-${latest}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "${branch}" origin/main

          git add "${CHART_DIR}/Chart.yaml"
          git commit -m "chore(chart): bump mosquitto to ${latest}" || {
            echo "No changes to commit."
            exit 0
          }

          git push --force-with-lease origin "${branch}"

          echo "BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Open or update PR (and label)
        if: steps.decide.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          latest="${{ steps.upstream.outputs.latest_ver }}"
          branch="${BRANCH}"

          title="chore(chart): bump mosquitto to ${latest}"
          body=$'Automated bump from upstream tags.\n\n- appVersion: '"${latest}"$'\n- chart version: '"${latest}"$'\n'

          if gh pr view "${branch}" >/dev/null 2>&1; then
            gh pr edit "${branch}" --title "${title}" --body "${body}" || true
          else
            gh pr create --head "${branch}" --base main --title "${title}" --body "${body}"
          fi

          gh label create "${PR_LABEL}" --color "0366d6" --description "Automated dependency updates" >/dev/null 2>&1 || true
          gh pr edit "${branch}" --add-label "${PR_LABEL}" || true
