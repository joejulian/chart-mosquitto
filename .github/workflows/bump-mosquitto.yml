name: Bump Mosquitto appVersion and chart version

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: chart
      UPSTREAM_REPO: https://github.com/eclipse-mosquitto/mosquitto.git
      PR_BRANCH_PREFIX: bump-mosquitto
      PR_LABEL: dependencies

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install python deps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install ruamel.yaml

      - name: Discover latest upstream version (tags only)
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(
            git ls-remote --tags --sort='v:refname' "${UPSTREAM_REPO}" \
              | awk '{print $2}' \
              | sed -n 's#^refs/tags/##p' \
              | sed 's/\^{}$//' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | tail -n 1
          )"

          if [[ -z "${latest_tag}" ]]; then
            echo "Failed to determine upstream version" >&2
            exit 1
          fi

          echo "latest_ver=${latest_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml (appVersion + chart patch bump)
        id: chart
        shell: bash
        env:
          LATEST_APP: ${{ steps.upstream.outputs.latest_ver }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path
          from ruamel.yaml import YAML

          chart_path = Path(os.environ["CHART_DIR"]) / "Chart.yaml"
          latest_app = os.environ["LATEST_APP"]

          yaml = YAML()
          yaml.preserve_quotes = True

          data = yaml.load(chart_path.read_text())

          cur_app = str(data.get("appVersion", "")).strip()
          cur_ver = str(data.get("version", "")).strip()

          if not cur_app or not cur_ver:
            raise SystemExit("Chart.yaml must contain appVersion and version")

          def split(v):
            return tuple(map(int, v.split(".")))

          cur_app_v = split(cur_app)
          latest_app_v = split(latest_app)

          if latest_app_v[0] != cur_app_v[0]:
            raise SystemExit(
              f"Upstream major version change {cur_app} → {latest_app}; "
              "chart requires manual intervention"
            )

          if latest_app == cur_app:
            Path(os.environ["GITHUB_OUTPUT"]).write_text("changed=false\n")
            raise SystemExit(0)

          # bump chart patch version
          major, minor, patch = map(int, cur_ver.split("."))
          new_chart_ver = f"{major}.{minor}.{patch + 1}"

          data["appVersion"] = latest_app
          data["version"] = new_chart_ver

          with chart_path.open("w") as f:
            yaml.dump(data, f)

          Path(os.environ["GITHUB_OUTPUT"]).write_text(
            "changed=true\n"
            f"new_app={latest_app}\n"
            f"new_chart_ver={new_chart_ver}\n"
          )
          PY

      - name: Commit and push branch
        if: steps.chart.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          branch="${PR_BRANCH_PREFIX}-${{ steps.chart.outputs.new_app }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "${branch}" origin/main
          git add "${CHART_DIR}/Chart.yaml"
          git commit -m "chore(chart): bump mosquitto to ${{ steps.chart.outputs.new_app }}"
          git push --force-with-lease origin "${branch}"

          echo "BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Open or update PR
        if: steps.chart.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          branch="${BRANCH}"
          app="${{ steps.chart.outputs.new_app }}"
          chart_ver="${{ steps.chart.outputs.new_chart_ver }}"

          title="chore(chart): bump mosquitto to ${app}"
          body=$'Automated bump from upstream tags.\n\n- appVersion: '"${app}"$'\n- chart version: '"${chart_ver}"$'\n'

          if gh pr view "${branch}" >/dev/null 2>&1; then
            gh pr edit "${branch}" --title "${title}" --body "${body}"
          else
            gh pr create --head "${branch}" --base main --title "${title}" --body "${body}"
          fi

          gh label create "${PR_LABEL}" --color "0366d6" \
            --description "Automated dependency updates" >/dev/null 2>&1 || true
          gh pr edit "${branch}" --add-label "${PR_LABEL}" || true

