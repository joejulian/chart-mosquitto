name: Publish Helm chart to GHCR (if missing) + Ensure signed

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: chart
      GHCR_DEST: oci://ghcr.io/joejulian/charts
      COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
      COSIGN_IDENTITY: "https://github.com/joejulian/chart-mosquitto/.github/workflows/publish.yml@refs/heads/main"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install crane
        uses: imjasonh/setup-crane@v0.3

      - name: Log in to GHCR for Helm
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Log in to GHCR for cosign/crane
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute chart ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          name="$(awk -F': ' '$1=="name"{print $2; exit}' "${CHART_DIR}/Chart.yaml" | tr -d '"' | tr -d "'")"
          ver="$(awk -F': ' '$1=="version"{print $2; exit}' "${CHART_DIR}/Chart.yaml" | tr -d '"' | tr -d "'")"
          dest="${GHCR_DEST#oci://}"
          ref="${dest}/${name}:${ver}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check whether chart version exists
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          if crane manifest "${{ steps.ref.outputs.ref }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          helm lint "${CHART_DIR}"
          helm package "${CHART_DIR}" --destination dist

      - name: Push chart to GHCR
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          helm push dist/*.tgz "${GHCR_DEST}"

      - name: Resolve digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.ref.outputs.ref }}"
          digest="$(crane digest "$ref")"
          digref="${ref%%@*}@${digest}"
          echo "digref=$digref" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          digref="${{ steps.digest.outputs.digref }}"

          if cosign verify \
              --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
              --certificate-identity "${COSIGN_IDENTITY}" \
              "$digref" >/dev/null 2>&1; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cosign sign (keyless)
        if: steps.verify.outputs.signed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.digest.outputs.digref }}"

      - name: Verify signature (must succeed)
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            --certificate-identity "${COSIGN_IDENTITY}" \
            "${{ steps.digest.outputs.digref }}" >/dev/null
