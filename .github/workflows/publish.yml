name: Publish Helm chart to GHCR (if missing)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: chart
      GHCR_DEST: oci://ghcr.io/joejulian/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install crane
        uses: imjasonh/setup-crane@v0.3

      - name: Log in to GHCR for Helm
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Log in to GHCR for cosign/crane (Docker creds)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute chart ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail

          name="$(awk -F': ' '$1=="name"{print $2; exit}' "${CHART_DIR}/Chart.yaml" | tr -d '"' | tr -d "'")"
          ver="$(awk -F': ' '$1=="version"{print $2; exit}' "${CHART_DIR}/Chart.yaml" | tr -d '"' | tr -d "'")"

          dest="${GHCR_DEST#oci://}"
          ref="${dest}/${name}:${ver}"

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check whether this chart version is already published
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.ref.outputs.ref }}"

          if crane manifest "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Already published: $ref"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Not published yet: $ref"
          fi

      - name: Package chart
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          helm lint "${CHART_DIR}"
          helm package "${CHART_DIR}" --destination dist
          ls -la dist

      - name: Push chart to GHCR (OCI)
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          helm push dist/*.tgz "${GHCR_DEST}"
          echo "Pushed ${{ steps.ref.outputs.ref }}"

      - name: Cosign sign (keyless, by digest)
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.ref.outputs.ref }}"
          digest="$(crane digest "$ref")"
          digref="${ref%@*}@${digest}"
          cosign sign --yes "$digref"
